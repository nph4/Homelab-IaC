services:
  stateful-test:
    image: alpine:3.20
    container_name: komodo-stateful-poc
    restart: unless-stopped
    command: ["sh", "-c", "cat /data/marker.txt; echo \"TEST_SECRET_VALUE=$${TEST_SECRET_VALUE}\"; sleep infinity"]
    env_file:
      - /home/nelson/containers/komodo-poc-stateful-test/.env
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - legacy-data:/data

volumes:
  legacy-data:
    name: komodo-stateful-poc-legacy_data
    external: true

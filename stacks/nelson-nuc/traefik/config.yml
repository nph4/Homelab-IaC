http:
  # region routers
  routers:
    proxmox:
      entryPoints:
        - https
      rule: "Host(`proxmox.local.nelsonhickman.com`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls:
        certResolver: cloudflare
      service: proxmox

    crashplan:
      entryPoints:
        - https
      rule: "Host(`crashplan.local.nelsonhickman.com`)"
      middlewares:
        - default-headers
      tls:
        certResolver: cloudflare
      service: crashplan

    # --- added from CSV ---
    unifi:
      entryPoints:
        - https
      rule: "Host(`unifi.local.nelsonhickman.com`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls:
        certResolver: cloudflare
      service: unifi

    paperless:
      entryPoints:
        - https
      rule: "Host(`paperless.local.nelsonhickman.com`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls:
        certResolver: cloudflare
      service: paperless

    # Runs on kirks-bar (GPU host), so no Docker labels; same rule and no middlewares, as its old labels had
    jellyfin:
      entryPoints:
        - https
      rule: "Host(`jellyfin.local.nelsonhickman.com`)"
      tls:
        certResolver: cloudflare
      service: jellyfin


    router:
      entryPoints:
        - https
      rule: "Host(`router.local.nelsonhickman.com`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls:
        certResolver: cloudflare
      service: router

    nas:
      entryPoints:
        - https
      rule: "Host(`nas.local.nelsonhickman.com`)"
      middlewares:
        - default-headers
        - https-redirectscheme
      tls:
        certResolver: cloudflare
      service: nas
  # endregion

  # region services
  services:
    proxmox:
      loadBalancer:
        servers:
          - url: "https://192.168.88.10:8006"
        passHostHeader: true

    crashplan:
      loadBalancer:
        servers:
          - url: "http://100.76.105.3:5800/"
        passHostHeader: true

    # --- added from CSV ---
    unifi:
      loadBalancer:
        servers:
          - url: "https://192.168.88.101:8443"
        passHostHeader: true

    paperless:
      loadBalancer:
        servers:
          - url: "http://100.76.105.3:8010"
        passHostHeader: true

    jellyfin:
      loadBalancer:
        servers:
          - url: "http://192.168.88.23:8096"
        passHostHeader: true


    router:
      loadBalancer:
        servers:
          - url: "http://router.lan"
        passHostHeader: true

    nas:
      loadBalancer:
        servers:
          - url: "http://nas.lan"
        passHostHeader: true
  # endregion

  middlewares:
    https-redirectscheme:
      redirectScheme:
        scheme: https
        permanent: true

    default-headers:
      headers:
        frameDeny: true
        browserXssFilter: true
        contentTypeNosniff: true

        # HSTS (Strict-Transport-Security)
        forceSTSHeader: true
        stsSeconds: 15552000
        stsIncludeSubdomains: true
        stsPreload: true

        customFrameOptionsValue: SAMEORIGIN
        customRequestHeaders:
          X-Forwarded-Proto: https

    default-whitelist:
      ipAllowList:
        sourceRange:
          - "10.0.0.0/8"
          - "192.168.0.0/16"
          - "172.16.0.0/12"

    secured:
      chain:
        middlewares:
          - default-whitelist
          - default-headers

    traefik-auth:
      basicAuth:
        usersFile: /run/secrets/traefik_dashboard_htpasswd

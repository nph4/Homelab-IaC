services:
  postgres:
    image: postgres:16-alpine
    container_name: reactive-resume-postgres
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    env_file:
      - /home/nelson/containers/reactive-resume/.env
    environment:
      TZ: America/Los_Angeles
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    labels:
      # Nightly pg_dumpall to the NAS (homelab-ansible playbooks/db-backup.yml)
      - "homelab.backup.postgres=true"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  chrome:
    image: ghcr.io/browserless/chromium:v2.18.0
    container_name: reactive-resume-chrome
    restart: unless-stopped
    networks:
      - internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: America/Los_Angeles
      TIMEOUT: 10000
      CONCURRENT: 10
      EXIT_ON_HEALTH_FAILURE: "true"
      PRE_REQUEST_HEALTH_CHECK: "true"

  app:
    image: amruthpillai/reactive-resume:v5.0.11
    container_name: reactive-resume
    restart: unless-stopped
    depends_on:
      - postgres
      - chrome
    networks:
      - internal
      - proxy
    env_file:
      - /home/nelson/containers/reactive-resume/.env
    # No S3_* vars are set, so uploads (profile pictures) go to local storage at /app/data
    volumes:
      - app_data:/app/data
    environment:
      TZ: America/Los_Angeles
      PORT: 3000
      NODE_ENV: production

      APP_URL: https://resume.local.nelsonhickman.com

      PRINTER_ENDPOINT: ws://chrome:3000

      # Optional — set FLAG_DISABLE_SIGNUPS / FLAG_DISABLE_EMAIL_AUTH in the .env file to enable.

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.rr.rule=Host(`resume.local.nelsonhickman.com`)"
      - "traefik.http.routers.rr.entrypoints=https"
      - "traefik.http.routers.rr.tls=true"
      - "traefik.http.routers.rr.tls.certresolver=cloudflare"
      - "traefik.http.services.rr.loadbalancer.server.port=3000"

volumes:
  app_data:
  postgres_data:

networks:
  proxy:
    external: true
  internal:
    driver: bridge

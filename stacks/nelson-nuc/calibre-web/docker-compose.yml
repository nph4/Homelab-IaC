services:
  calibre-web:
    image: lscr.io/linuxserver/calibre-web:0.6.26-ls372
    container_name: calibre-web
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Los_Angeles
      - DOCKER_MODS=linuxserver/mods:universal-calibre
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
      - GUNICORN_WORKERS=1
    volumes:
      - /srv/containers/calibre/config:/config
      - /mnt/nas/media/Books:/books
      - /srv/containers/calibre/config/metadata.db:/books/metadata.db
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.calibre.rule=Host(`calibre.local.nelsonhickman.com`)
      - traefik.http.routers.calibre.entrypoints=https
      - traefik.http.routers.calibre.tls=true
      - traefik.http.routers.calibre.tls.certresolver=cloudflare
      - traefik.http.services.calibre.loadbalancer.server.port=8083
      # Nightly SQLite backup to the NAS (homelab-ansible playbooks/db-backup.yml).
      # metadata.db is the Calibre library database, bind-mounted from local disk over /books.
      - homelab.backup.sqlite=/config/app.db,/config/metadata.db


networks:
  proxy:
    external: true

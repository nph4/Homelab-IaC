version: "3.8"

services:
  uptime-kuma:
    image: louislam/uptime-kuma:2.2.0
    container_name: uptime-kuma
    restart: always

    environment:
      TZ: America/Los_Angeles

    networks:
      - proxy
    volumes:
      - uptime-kuma:/app/data
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.kuma.rule=Host(`kuma.local.nelsonhickman.com`)"
      - "traefik.http.routers.kuma.entrypoints=https"
      - "traefik.http.routers.kuma.tls=true"
      - "traefik.http.routers.kuma.tls.certresolver=cloudflare"
      - "traefik.http.services.kuma.loadbalancer.server.port=3001"

volumes:
  # Pinned to the pre-existing volume (created under the old Portainer
  # project name "uptime_kuma") so GitOps redeploy reuses monitor
  # history instead of creating an empty volume under a new project name.
  uptime-kuma:
    name: uptime_kuma_uptime-kuma
    external: true

networks:
  proxy:
    external: true

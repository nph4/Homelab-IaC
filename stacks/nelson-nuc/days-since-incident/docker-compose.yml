services:
  days-since-incident:
    image: days-since-incident:1.0.0
    build: .
    container_name: days-since-incident
    restart: unless-stopped

    environment:
      - TZ=America/Los_Angeles

    volumes:
      - data:/data

    networks:
      - proxy

    labels:
      - "traefik.enable=true"

      # Router
      - "traefik.http.routers.days-since-incident.rule=Host(`days-since.local.nelsonhickman.com`)"
      - "traefik.http.routers.days-since-incident.entrypoints=https"
      - "traefik.http.routers.days-since-incident.tls=true"
      - "traefik.http.routers.days-since-incident.tls.certresolver=cloudflare"

      # Service
      - "traefik.http.services.days-since-incident.loadbalancer.server.port=5000"

volumes:
  # Pinned to the pre-existing volume (created under the old Portainer
  # project name "days-since-incident") so GitOps redeploy reuses the
  # real last_reset.txt instead of creating an empty volume under
  # whatever the new project name happens to be.
  data:
    name: days-since-incident_data
    external: true

networks:
  proxy:
    external: true

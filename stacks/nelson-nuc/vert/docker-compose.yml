version: "3.8"

services:
  vert:
    # No release tags upstream; sha-<commit> tags are immutable. Bump by picking a newer sha- tag.
    image: ghcr.io/vert-sh/vert:sha-257bcb3
    container_name: vert
    restart: unless-stopped

    environment:
      TZ: America/Los_Angeles

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.vert.rule=Host(`vert.local.nelsonhickman.com`)"
      - "traefik.http.routers.vert.entrypoints=https"
      - "traefik.http.routers.vert.tls=true"
      - "traefik.http.routers.vert.tls.certresolver=cloudflare"

      - "traefik.http.routers.vert.middlewares=authelia@docker"

      - "traefik.http.services.vert.loadbalancer.server.port=80"

networks:
  proxy:
    external: true

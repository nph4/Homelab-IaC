version: "3.8"

services:
  adventurelog:
    image: ghcr.io/seanmorley15/adventurelog:v0.13.0
    container_name: adventurelog
    restart: unless-stopped

    networks:
      - proxy

    depends_on:
      adventurelog-db:
        condition: service_healthy

    volumes:
      - adventurelog-media:/code/media/

    env_file:
      - /home/nelson/containers/adventurelog/.env

    environment:
      TZ: America/Los_Angeles
      SITE_URL: https://adventurelog.nelsonhickman.com
      PGHOST: adventurelog-db
      POSTGRES_DB: database
      POSTGRES_USER: adventure
      PORT: "3000"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:80/health')\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.adventurelog.rule=Host(`adventurelog.local.nelsonhickman.com`) || Host(`adventurelog.nelsonhickman.com`)"
      - "traefik.http.routers.adventurelog.entrypoints=https"
      - "traefik.http.routers.adventurelog.tls=true"
      - "traefik.http.routers.adventurelog.tls.certresolver=cloudflare"
      - "traefik.http.services.adventurelog.loadbalancer.server.port=80"

  adventurelog-db:
    image: postgis/postgis:16-3.5
    container_name: adventurelog-db
    restart: unless-stopped

    networks:
      - proxy

    volumes:
      - adventurelog-db:/var/lib/postgresql/data/

    env_file:
      - /home/nelson/containers/adventurelog/.env

    environment:
      TZ: America/Los_Angeles
      POSTGRES_DB: database
      POSTGRES_USER: adventure

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adventure -d database"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  adventurelog-media:
    driver: local
  adventurelog-db:
    driver: local

networks:
  proxy:
    external: true

version: "3.8"

services:
  ansible:
    image: peco602/ansible-linux-docker:latest
    container_name: ansible
    restart: unless-stopped

    # Override the default one-shot CMD so the container stays running
    command: ["tail", "-f", "/dev/null"]

    environment:
      - TZ=America/Los_Angeles

    volumes:
      - /home/nelson/containers/ansible/data:/etc/ansible
      # SSH key for the `ansible` user on managed hosts, plus known_hosts, so both survive a redeploy
      - /home/nelson/containers/ansible/ssh:/root/.ssh
      # /ansible is the image's WORKDIR (where the web terminal lands) - persist it
      # so the playbook repo (github.com/nph4/ansible) cloned there survives a redeploy
      - /home/nelson/containers/ansible/repo:/ansible

    networks:
      - proxy

  ansible-terminal:
    image: tsl0922/ttyd:1.7.8
    container_name: ansible-terminal
    restart: unless-stopped

    # The image's entrypoint is tini, and its default CMD is `ttyd -W bash` -
    # ttyd itself is part of the command, not a fixed entrypoint, so it must
    # be included explicitly here or this replaces ttyd entirely and runs
    # the exec directly as PID 1 (fails immediately: "input device is not a TTY").
    command: ["ttyd", "-W", "docker", "exec", "-it", "ansible", "bash"]

    environment:
      - TZ=America/Los_Angeles

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Docker binary path on the host — adjust if `which docker` differs on nelson-nuc
      - /usr/bin/docker:/usr/bin/docker:ro

    networks:
      - proxy

    depends_on:
      - ansible

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"

      - "traefik.http.routers.ansible.rule=Host(`ansible.local.nelsonhickman.com`)"
      - "traefik.http.routers.ansible.entrypoints=https"
      - "traefik.http.routers.ansible.tls=true"
      - "traefik.http.routers.ansible.tls.certresolver=cloudflare"
      # Basic auth in front of the terminal: it's a root shell into the Ansible
      # control node. Reuses the file-provider middleware (and htpasswd secret)
      # already protecting the Traefik dashboard.
      - "traefik.http.routers.ansible.middlewares=traefik-auth@file"

      - "traefik.http.services.ansible.loadbalancer.server.port=7681"

networks:
  proxy:
    external: true

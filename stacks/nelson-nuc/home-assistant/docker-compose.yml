version: "3.8"

services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.9.0
    restart: unless-stopped
    privileged: true

    networks:
      - proxy

    environment:
      TZ: America/Los_Angeles

    volumes:
      - /home/nelson/containers/home_assist:/config
      - /etc/localtime:/etc/localtime:ro

    # Zigbee dongle, mapped from its stable by-id symlink to a fixed name so ZHA
    # (configured for /dev/zigbee) doesn't depend on it enumerating as ttyACM0.
    # Docker resolves the symlink when the container is created.
    devices:
      - /dev/serial/by-id/usb-ITEAD_SONOFF_Zigbee_3.0_USB_Dongle_Plus_V2_20231007170118-if00:/dev/zigbee

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.homeassistant.rule=Host(`homeassistant.local.nelsonhickman.com`)"
      - "traefik.http.routers.homeassistant.entrypoints=https"
      - "traefik.http.routers.homeassistant.tls=true"
      - "traefik.http.routers.homeassistant.tls.certresolver=cloudflare"
      - "traefik.http.services.homeassistant.loadbalancer.server.port=8123"
      # Nightly SQLite backup to the NAS (homelab-ansible playbooks/db-backup.yml)
      - "homelab.backup.sqlite=/config/home-assistant_v2.db,/config/zigbee.db"

networks:
  proxy:
    external: true

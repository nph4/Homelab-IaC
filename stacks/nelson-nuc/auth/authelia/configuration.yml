# Authelia 4.39 configuration. Secrets come from *_FILE env vars or, where Authelia has no env var,
# the template filter's secret function (X_AUTHELIA_CONFIG_FILTERS=template), both reading files under
# /home/nelson/containers/auth/secrets/ on nelson-nuc, never from this file.

theme: auto

server:
  address: tcp://:9091/

log:
  level: info

totp:
  issuer: nelsonhickman.com

webauthn:
  display_name: Homelab
  enable_passkey_login: true

identity_validation:
  reset_password:
    jwt_algorithm: HS256  # secret: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE

authentication_backend:
  password_reset:
    disable: false
  ldap:
    implementation: lldap
    address: ldap://lldap:3890
    base_dn: dc=nelsonhickman,dc=com
    # Service account in LLDAP group lldap_password_manager, so password resets work
    user: uid=authelia,ou=people,dc=nelsonhickman,dc=com

password_policy:
  zxcvbn:
    enabled: true
    min_score: 3

definitions:
  network:
    # LAN and tailnet: password only. Never add Docker ranges (172.16.0.0/12): public traffic
    # arrives from the cloudflared container (172.29.0.20), so it would count as internal.
    internal:
      - 192.168.88.0/24
      - 100.64.0.0/10
      - fd7a:115c:a1e0::/48
      # proxy network gateway: tailnet clients arrive as this, since nelson-nuc's subnet route
      # SNATs them. Safe only while cloudflared's ingress targets https://traefik:443; pointing it
      # at https://192.168.88.101:443 would make public traffic arrive from here too.
      - 172.29.0.1/32

access_control:
  default_policy: deny
  rules:
    # Uptime Kuma push monitors (nebula-sync on quark-vm). The token in the path is the secret.
    - domain: kuma.local.nelsonhickman.com
      resources:
        - '^/api/push/[A-Za-z0-9]+([?].*)?$'
      policy: bypass
    # Monitoring account (LLDAP user uptime-kuma, group monitoring): Uptime Kuma monitors and Dashy
    # status checks send it as HTTP Basic auth. Basic auth is one factor only, so it's limited to
    # the LAN/tailnet; from anywhere else no rule matches the group and the request is denied.
    # Add each new forward-auth hostname here as well as below.
    - domain: &forward_auth_sites
        - it-tools.local.nelsonhickman.com
        - dashy.local.nelsonhickman.com
        - kuma.local.nelsonhickman.com
      policy: one_factor
      networks:
        - internal
      subject:
        - group:monitoring
    - domain: *forward_auth_sites
      policy: one_factor
      networks:
        - internal
      subject:
        - group:admins
        - group:users
    - domain: *forward_auth_sites
      policy: two_factor
      subject:
        - group:admins
        - group:users

identity_providers:
  oidc:
    # hmac_secret: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
    jwks:
      - key_id: main
        algorithm: RS256
        use: sig
        key: {{ secret "/run/secrets/authelia_oidc_jwks_rsa" | mindent 10 "|" | msquote }}
    authorization_policies:
      # Same as the forward-auth rules: password only from the LAN or tailnet, TOTP from anywhere else
      homelab:
        default_policy: deny
        rules:
          - policy: one_factor
            networks:
              - internal
            subject:
              - group:admins
              - group:users
          - policy: two_factor
            subject:
              - group:admins
              - group:users
    clients:
      - client_id: immich
        client_name: Immich
        # pbkdf2 digest; Immich holds the plaintext (also in secrets/immich_oidc_client_secret)
        client_secret: '{{ secret "/run/secrets/authelia_oidc_immich_client_secret_digest" }}'
        public: false
        authorization_policy: homelab
        consent_mode: implicit
        require_pkce: true
        pkce_challenge_method: S256
        redirect_uris:
          - https://immich.local.nelsonhickman.com/auth/login
          - https://immich.local.nelsonhickman.com/user-settings
          - app.immich:///oauth-callback
        scopes:
          - openid
          - profile
          - email
        response_types:
          - code
        grant_types:
          - authorization_code
        id_token_signed_response_alg: RS256
        userinfo_signed_response_alg: RS256
        token_endpoint_auth_method: client_secret_post

session:
  name: authelia_session
  inactivity: 1h
  expiration: 12h
  remember_me: 1M
  # In memory: a single instance doesn't need Redis; a restart logs everyone out.
  cookies:
    - domain: nelsonhickman.com
      authelia_url: https://auth.nelsonhickman.com

# The login page is public, so keep brute-force regulation on.
regulation:
  modes:
    - user
  max_retries: 3
  find_time: 2m
  ban_time: 10m

storage:
  local:
    path: /config/db.sqlite3

# No SMTP yet: one-time codes for registering MFA devices and password resets are written here.
# Read with: docker exec authelia cat /config/notification.txt
notifier:
  filesystem:
    filename: /config/notification.txt
